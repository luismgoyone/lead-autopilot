    <path d="M 28 16 C 29 16, 31 16, 32 16 C 30 19, 27 24, 25 28 C 24.5 27, 25 25, 26 23 Z" fill="#F4F1EA" opacity="0.6"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(82, 45)">
    <text font-family="'Fraunces', serif" font-weight="700" font-size="22" fill="#1F2A30" letter-spacing="-0.02em">Pinecrest</text>
    <text x="105" font-family="'Fraunces', serif" font-weight="400" font-style="italic" font-size="22" fill="#2F5D50" letter-spacing="-0.01em">Dental</text>
    <text y="18" font-family="'Inter', sans-serif" font-weight="500" font-size="9.5" fill="#607274" letter-spacing="0.16em" text-transform="uppercase">BAGUIO CITY • FAMILY CLINIC</text>
  </g>
</svg>