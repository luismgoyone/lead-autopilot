    <!-- Stylized pine tree shaping a tooth crown with two root trunks -->
    <path d="M 30 11 
             C 32 11, 35 15, 37 17 
             L 43 23 C 45 25, 43 27, 40 27 L 45 33 C 47 35, 45 37, 42 37 L 46 43 C 48 46, 45 48, 42 48
             L 37 48 C 36 50, 36 53, 35 55 C 34 56, 32 56, 31 53 C 30.5 50.5, 30.5 49, 30 49
             C 29.5 49, 29.5 50.5, 29 53 C 28 56, 26 56, 25 55 C 24 53, 24 50, 23 48
             L 18 48 C 15 48, 12 46, 14 43 L 18 37 C 15 37, 13 35, 15 33 L 20 27 C 17 27, 15 25, 17 23 
             L 23 17 C 25 15, 28 11, 30 11 Z" 
          fill="#2F5D50" />
